[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lx-tool"
version = "0.1.0"
description = "Fixture library matching and conversion for lighting consoles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# The library and CLI deliberately have no third-party dependencies, so a
# console in a venue can run them with nothing but Python installed.
dependencies = []

[project.optional-dependencies]
web = [
    "certifi",          # macOS Python ships no CA bundle of its own
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
# Native window for the packaged app. pywebview drives the OS webview -
# WKWebView on macOS, WebView2 on Windows - so the app gets its own window
# and dock icon instead of opening a browser tab.
desktop = [
    "certifi",
    "pywebview>=5.0",
    "pyobjc-core>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'",
]
# The X-Touch <-> grandMA3 bridge. Only the MIDI layer needs these; the
# protocol and mapping logic are dependency-free and test without hardware.
xtouch = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
lx = "lxtool.cli:main"
lx-web = "lxtool.web.app:serve"

[tool.setuptools.packages.find]
include = ["lxtool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
