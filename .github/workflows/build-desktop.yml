name: Build desktop apps

# Produces a macOS .app and a Windows .exe. They have to be built on their
# own platform - PyInstaller cannot cross-compile - so this runs a matrix
# rather than building everything on Linux.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # so a build can be kicked off without tagging

permissions:
  # Needed to attach the built binaries to a release. Repos created recently
  # give GITHUB_TOKEN read-only access by default, so the upload fails without
  # this even though the build itself succeeds.
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifact: dist/LX-Tool.app
          - os: windows-latest
            name: windows
            artifact: dist/LX-Tool.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Dependency downloads dominate an otherwise short build.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,desktop]"
          pip install -e "./xbridge[desktop]"
          pip install pyinstaller

      - name: Test
        shell: bash
        run: |
          pip install pytest
          pytest -q
          pytest -q xbridge/tests

      - name: Stamp the build
        shell: bash
        # Replace the two values IN PLACE - overwriting the file used to
        # delete label(), which is what made every shipped app say
        # "unknown build".
        run: |
          sed -i.bak -e "s/^COMMIT = .*/COMMIT = \"$(git rev-parse --short HEAD)\"/" \
                     -e "s/^DATE = .*/DATE = \"$(date -u +%Y-%m-%d)\"/" lxtool/_build.py
          rm -f lxtool/_build.py.bak
          python -c "from lxtool import _build; print(_build.label())" 

      - name: Build
        run: pyinstaller --noconfirm packaging/lxtool.spec

      - name: Build XBridge
        run: pyinstaller --noconfirm xbridge/packaging/xbridge.spec

      # Ad-hoc signing keeps Gatekeeper from reporting the app as
      # "damaged" after download. Real trust (no right-click-to-open, no
      # SmartScreen) needs paid certificates: an Apple Developer ID with
      # notarisation, and a Windows Authenticode cert. When those exist,
      # add the secrets and swap this for a real codesign/signtool step.
      - name: Sign macOS apps (ad-hoc)
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - dist/LX-Tool.app
          codesign --force --deep --sign - dist/XBridge.app

      - name: Zip macOS apps
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r LX-Tool-macos.zip LX-Tool.app
          zip -r XBridge-macos.zip XBridge.app

      - uses: actions/upload-artifact@v4
        with:
          name: LX-Tool-${{ matrix.name }}
          path: |
            dist/LX-Tool-macos.zip
            dist/LX-Tool.exe
            dist/XBridge-macos.zip
            dist/XBridge.exe
          if-no-files-found: warn

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          # A tag build publishes under its tag. A manually dispatched build
          # publishes to the rolling "latest" release, so there is always a
          # public download link for the newest main without needing a tag:
          # https://github.com/Wntr2134/LX-Tool/releases/latest
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          files: |
            dist/LX-Tool-macos.zip
            dist/LX-Tool.exe
            dist/XBridge-macos.zip
            dist/XBridge.exe
